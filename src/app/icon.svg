<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Sổ tiền">
  <defs>
    <linearGradient id="logo-ramp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a21caf"/>
      <stop offset="45%" stop-color="#c0208d"/>
      <stop offset="100%" stop-color="#d61f6d"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#logo-ramp)"/>
  <!--
    Dấu ₫ vẽ bằng path thay vì <text>: chữ ₫ thiếu trong nhiều font hệ thống,
    để dạng text thì máy nào không có font sẽ hiện ô vuông.
    Nét dày và gạch dưới kéo sát thân chữ để ở cỡ 16px trên tab vẫn đọc ra.
  -->
  <g fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M26.5 16h6a13 13 0 0 1 0 26h-6V16z"/>
    <path d="M18 29h11"/>
    <path d="M22 51h20"/>
  </g>
</svg>
